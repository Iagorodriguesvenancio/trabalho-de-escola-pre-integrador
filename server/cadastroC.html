<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de cadastroas</title>
</head>

<body>
    <input type="number" name="" id="id_u"><br>
    <input type="number" name="" id="id_p"><br>
    <input type="number" name="" id="quantidade"><br>
    <input type="number" name="" id="total"><br>
    <input type="date" name="" id="data_compra"><br>
    <input type="number" name="" id="pago">
    <button onclick="cadastro()">cadastro</button>
    <div class="res">

    </div>
    <script>
        async function cadastro() {
            const resposta = await fetch("http://localhost:3000/cadastroComp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                     id_u:document.querySelector("#id_u").value,
                    id_p:document.querySelector("#id_p").value,
                    quantidade:document.querySelector("#quantidade").value,
                    total:document.querySelector("#total").value,
                    data_compra:document.querySelector("#data_compra").value,
                    pago:document.querySelector("#pago").value
                })
            });

             const resultado = await resposta.json();
            alert(resultado.mensagem);
        }
    </script>
</body>

</html>
