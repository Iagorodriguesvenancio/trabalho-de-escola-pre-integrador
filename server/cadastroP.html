<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de cadastroas</title>
</head>

<body>
    <input type="text" name="" id="nome"><br>
    <input type="number" name="" id="preco"><br>
    <input type="number" name="" id="quantidade"><br>
    <input type="number" name="" id="tipo"><br>
    <input type="date" name="" id="validade"><br>
    <button onclick="cadastro()">cadastro</button>
    <div class="res">

    </div>
    <script>
        async function cadastro() {
            const resposta = await fetch("http://localhost:3000/cadastroProd", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome:document.querySelector("#nome").value,
                    preco:document.querySelector("#preco").value,
                    quantidade:document.querySelector("#quantidade").value,
                    tipo:document.querySelector("#tipo").value,
                    validade:document.querySelector("#validade").value
                })
            });

             const resultado = await resposta.json();
            alert(resultado.mensagem);
        }
    </script>
</body>

</html>
